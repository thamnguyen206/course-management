<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Loại khóa học')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Loại khóa học</h3>
        <a class="btn btn-primary" th:href="@{/categories/create}">+ Thêm loại khóa học</a>
    </div>

    <div th:replace="~{fragments :: alerts}"></div>

    <table class="table table-bordered align-middle">
        <thead class="table-light">
        <tr><th>#</th><th>Tên</th><th>Mô tả</th><th>Số khóa học</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="c : ${categories}">
            <td th:text="${c.id}"></td>
            <td th:text="${c.name}"></td>
            <td th:text="${c.description}"></td>
            <td th:text="${#lists.size(c.courses)}"></td>
            <td class="text-nowrap">
                <a class="btn btn-sm btn-outline-warning" th:href="@{/categories/{id}/edit(id=${c.id})}">Sửa</a>
                <form method="post" th:action="@{/categories/{id}/delete(id=${c.id})}" class="d-inline"
                      onsubmit="return confirm('Xóa loại khóa học này?')">
                    <button class="btn btn-sm btn-outline-danger">Xóa</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
