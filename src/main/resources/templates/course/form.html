<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${title})}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div class="container" style="max-width:720px">
    <h3 class="mb-3" th:text="${title}">Khóa học</h3>

    <form method="post" th:action="@{${action}}" th:object="${form}" novalidate>
        <div class="mb-3">
            <label class="form-label">Tên khóa học</label>
            <input type="text" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Loại khóa học</label>
            <select th:field="*{categoryId}" class="form-select" th:classappend="${#fields.hasErrors('categoryId')} ? 'is-invalid'">
                <option value="">-- Chọn loại khóa học --</option>
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{categoryId}"></div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Học phí (đ)</label>
                <input type="number" step="any" th:field="*{tuitionFee}" class="form-control" th:classappend="${#fields.hasErrors('tuitionFee')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{tuitionFee}"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Thời lượng (giờ)</label>
                <input type="number" th:field="*{duration}" class="form-control" th:classappend="${#fields.hasErrors('duration')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{duration}"></div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Mô tả</label>
            <textarea th:field="*{description}" rows="4" class="form-control" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
            <div class="invalid-feedback" th:errors="*{description}"></div>
        </div>

        <div class="form-check mb-3">
            <input type="checkbox" th:field="*{active}" class="form-check-input" id="active">
            <label class="form-check-label" for="active">Đang tuyển sinh</label>
        </div>

        <button type="submit" class="btn btn-primary">Lưu</button>
        <a class="btn btn-outline-secondary" th:href="@{/courses}">Hủy</a>
    </form>
</div>
</body>
</html>
