<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Danh sách khóa học')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Danh sách khóa học</h3>
        <a class="btn btn-primary" th:href="@{/courses/create}">+ Thêm khóa học</a>
    </div>

    <div th:replace="~{fragments :: alerts}"></div>

    <!-- Form tìm kiếm / lọc / sắp xếp (giữ lại giá trị đã nhập) -->
    <form method="get" th:action="@{/courses}" class="card card-body mb-3">
        <div class="row g-2">
            <div class="col-md-4">
                <label class="form-label">Tên khóa học</label>
                <input type="text" name="keyword" class="form-control" th:value="${filter.keyword}" placeholder="Nhập một phần tên...">
            </div>
            <div class="col-md-3">
                <label class="form-label">Loại khóa học</label>
                <select name="categoryId" class="form-select">
                    <option value="">-- Tất cả --</option>
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"
                            th:selected="${cat.id == filter.categoryId}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label">Trạng thái</label>
                <select name="status" class="form-select">
                    <option value="">-- Tất cả --</option>
                    <option value="active" th:selected="${filter.status == 'active'}">Đang tuyển sinh</option>
                    <option value="inactive" th:selected="${filter.status == 'inactive'}">Ngừng tuyển sinh</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Sắp xếp</label>
                <select name="sort" class="form-select">
                    <option value="">-- Mặc định --</option>
                    <option value="fee_asc" th:selected="${filter.sort == 'fee_asc'}">Học phí tăng dần</option>
                    <option value="fee_desc" th:selected="${filter.sort == 'fee_desc'}">Học phí giảm dần</option>
                    <option value="duration_asc" th:selected="${filter.sort == 'duration_asc'}">Thời lượng tăng dần</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Học phí tối thiểu</label>
                <input type="number" step="any" name="minFee" class="form-control" th:value="${filter.minFee}">
            </div>
            <div class="col-md-3">
                <label class="form-label">Học phí tối đa</label>
                <input type="number" step="any" name="maxFee" class="form-control" th:value="${filter.maxFee}">
            </div>
            <div class="col-md-6 d-flex align-items-end gap-2">
                <button type="submit" class="btn btn-primary">Tìm kiếm / Lọc</button>
                <a class="btn btn-outline-secondary" th:href="@{/courses}">Xóa bộ lọc</a>
            </div>
        </div>
    </form>

    <div class="alert alert-info" th:if="${error == null and #lists.isEmpty(courses)}">
        Không tìm thấy khóa học nào phù hợp.
    </div>

    <div class="table-responsive" th:if="${!#lists.isEmpty(courses)}">
        <table class="table table-bordered align-middle">
            <thead class="table-light">
            <tr>
                <th>#</th>
                <th>Ảnh</th>
                <th>Tên khóa học</th>
                <th>Loại khóa học</th>
                <th>Học phí</th>
                <th>Thời lượng (giờ)</th>
                <th>Phân loại</th>
                <th>Trạng thái</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${courses}">
                <td th:text="${c.id}"></td>
                <td style="width:110px">
                    <img th:if="${c.thumbnailImage != null}" th:src="${c.thumbnailImage.imageUrl}" class="img-fluid rounded" alt="thumbnail">
                    <span th:if="${c.thumbnailImage == null}" class="text-muted small">Chưa có ảnh</span>
                </td>
                <td th:text="${c.name}"></td>
                <td th:text="${c.category.name}"></td>
                <td th:text="${#numbers.formatDecimal(c.tuitionFee, 0, 'POINT', 0, 'COMMA')} + ' đ'"></td>
                <td th:text="${c.duration}"></td>
                <td>
                    <span class="badge" th:classappend="${c.duration <= 30} ? 'bg-info' : 'bg-primary'" th:text="${c.durationType}"></span>
                </td>
                <td>
                    <span class="badge" th:classappend="${c.active} ? 'bg-success' : 'bg-secondary'" th:text="${c.statusText}"></span>
                </td>
                <td class="text-nowrap">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/courses/{id}(id=${c.id})}">Chi tiết</a>
                    <a class="btn btn-sm btn-outline-warning" th:href="@{/courses/{id}/edit(id=${c.id})}">Sửa</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
