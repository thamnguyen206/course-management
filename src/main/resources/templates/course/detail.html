<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Chi tiết khóa học')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0" th:text="${course.name}"></h3>
        <div>
            <a class="btn btn-warning" th:href="@{/courses/{id}/edit(id=${course.id})}">Sửa</a>
            <a class="btn btn-outline-secondary" th:href="@{/courses}">Quay lại</a>
        </div>
    </div>

    <div th:replace="~{fragments :: alerts}"></div>

    <div class="card mb-4">
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-3">Loại khóa học</dt><dd class="col-sm-9" th:text="${course.category.name}"></dd>
                <dt class="col-sm-3">Học phí</dt><dd class="col-sm-9" th:text="${#numbers.formatDecimal(course.tuitionFee, 0, 'POINT', 0, 'COMMA')} + ' đ'"></dd>
                <dt class="col-sm-3">Thời lượng</dt>
                <dd class="col-sm-9">
                    <span th:text="${course.duration} + ' giờ'"></span>
                    <span class="badge bg-info ms-1" th:text="${course.durationType}"></span>
                </dd>
                <dt class="col-sm-3">Trạng thái</dt>
                <dd class="col-sm-9">
                    <span class="badge" th:classappend="${course.active} ? 'bg-success' : 'bg-secondary'" th:text="${course.statusText}"></span>
                </dd>
                <dt class="col-sm-3">Mô tả</dt><dd class="col-sm-9" th:text="${course.description}"></dd>
            </dl>
        </div>
    </div>

    <h5>Hình ảnh khóa học</h5>

    <div class="alert alert-info" th:if="${#lists.isEmpty(course.images)}">Khóa học này chưa có ảnh.</div>

    <div class="row g-3 mb-4">
        <div class="col-md-4" th:each="img : ${course.images}">
            <div class="card h-100" th:classappend="${img.thumbnail} ? 'border-success border-2'">
                <img th:src="${img.imageUrl}" class="card-img-top" alt="Ảnh khóa học">
                <div class="card-body">
                    <span class="badge bg-success mb-2" th:if="${img.thumbnail}">Ảnh đại diện</span>
                    <div class="d-flex gap-2">
                        <form th:if="${!img.thumbnail}" method="post"
                              th:action="@{/courses/{cid}/images/{iid}/thumbnail(cid=${course.id}, iid=${img.id})}">
                            <button class="btn btn-sm btn-outline-success">Chọn làm ảnh đại diện</button>
                        </form>
                        <form method="post" th:action="@{/courses/{cid}/images/{iid}/delete(cid=${course.id}, iid=${img.id})}"
                              onsubmit="return confirm('Xóa ảnh này?')">
                            <button class="btn btn-sm btn-outline-danger">Xóa</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card card-body mb-5">
        <h6>Thêm ảnh bằng đường dẫn URL</h6>
        <form method="post" th:action="@{/courses/{id}/images(id=${course.id})}" class="row g-2 align-items-center">
            <div class="col-md-8">
                <input type="text" name="imageUrl" class="form-control" placeholder="https://example.com/anh.jpg" required>
            </div>
            <div class="col-md-2">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" name="thumbnail" value="true" id="thumb">
                    <label class="form-check-label" for="thumb">Làm ảnh đại diện</label>
                </div>
            </div>
            <div class="col-md-2">
                <button class="btn btn-primary w-100">Thêm ảnh</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
